name: Sync Release to Master

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge_release_to_master:
    name: Merge release -> master
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create temporary branch from master
        id: create_temp_branch
        run: |
          BRANCH_NAME="sync-release-to-master-$(date +%s)"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          git checkout -b $BRANCH_NAME

      - name: Merge release into temporary branch
        run: |
          git merge origin/release --no-edit

      - name: Merge temporary branch into master
        run: |
          git checkout master
          git merge ${{ steps.create_temp_branch.outputs.branch_name }} --no-edit

      - name: Push changes to master
        run: |
          git push origin master

      - name: Clean up temporary branch
        if: always()
        run: |
          git push origin --delete ${{ steps.create_temp_branch.outputs.branch_name }} || true
