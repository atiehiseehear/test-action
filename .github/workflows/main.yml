name: Start Production Phase

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  start_prod_phase:
    name: Start Prod Phase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Date Variable
        id: vars
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Check for differences
        id: diff_check
        run: |
          if git diff --quiet origin/release origin/devtest; then
            echo "HAS_DIFF=false" >> $GITHUB_OUTPUT
            echo "No differences between release and devtest. Skipping PR creation."
          else
            echo "HAS_DIFF=true" >> $GITHUB_OUTPUT
          fi

      - name: Create PR devtest -> release
        if: steps.diff_check.outputs.HAS_DIFF == 'true'
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --base release \
            --head devtest \
            --title "chore: sync devtest into release for prod" \
            --body "Automated PR to move devtest into release before production phase." \
            --label "automated")

          echo "PR_URL=$PR_URL" >> $GITHUB_OUTPUT

      - name: Auto Merge PR
        if: steps.diff_check.outputs.HAS_DIFF == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.create_pr.outputs.PR_URL }}" \
            --merge \
            --admin

      - name: Pull Latest Release
        run: |
          git fetch origin
          git checkout release
          git pull origin release

      - name: Create release/YYYY-MM-DD Branch
        run: |
          NEW_BRANCH="release-${{ steps.vars.outputs.DATE }}"
          git checkout -b $NEW_BRANCH
          git push origin $NEW_BRANCH

      - name: Notify Slack
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": ":rocket: *Production Phase Started*\n\n`devtest` has been merged into `release`.\nNew branch created: `release-${{ steps.vars.outputs.DATE }}`\n\nAll production fixes should now target this branch."
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}