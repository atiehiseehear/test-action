name: Sync Release to Master

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync_to_master:
    name: Sync release -> master
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important: Need full history to compare branches

      - name: Create and Auto-Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Create the PR directly from release to master
          # We capture the PR URL to use it in the next step
          PR_URL=$(gh pr create \
            --base master \
            --head release \
            --title "chore: sync release into master" \
            --body "Automated sync of release into master after production deploy." \
            --label "automated")
          
          echo "Created PR: $PR_URL"

          # 2. Enable Auto-Merge for this PR
          # This tells GitHub to merge it as soon as any checks pass
          gh pr merge "$PR_URL" --auto --merge