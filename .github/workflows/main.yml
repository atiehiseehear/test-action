name: Sync Release to Master

on:
  workflow_dispatch:
  push:
    branches: [release]   # optional: remove if you only want manual runs

permissions:
  contents: write
  pull-requests: write

jobs:
  sync_release_to_master:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Create or update PR (bot branch -> master)
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          # PR target
          base: master

          # PR source (this is the IMPORTANT part: use branch:, not head:)
          branch: bot/sync-release-to-master

          title: "chore: sync release into master"
          body: |
            Automated sync PR created from the current state of the release branch.
          labels: automated

          # Optional but nice:
          delete-branch: true

      - name: Enable auto-merge
        if: ${{ steps.cpr.outputs.pull-request-number != '' }}
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}

          # IMPORTANT: must match what master allows (merge / squash / rebase)
          merge-method: merge