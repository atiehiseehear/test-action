name: Sync Release to Master

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge_release_to_master:
    name: Merge release -> master
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Ensure PR label exists
        env:
          # Use a fine-grained PAT with repo permissions because the default GITHUB_TOKEN
          # cannot create PRs in this repository's policy setup.
          GH_TOKEN: ${{ secrets.PR_AUTOMATION_TOKEN }}
        run: |
          gh label create "automated" \
            --color BFD4F2 \
            --description "Automated PRs" || echo "Label already exists"

      - name: Create PR from release to master
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.PR_AUTOMATION_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --base master \
            --head release \
            --title "chore: sync release into master" \
            --body "Automated sync of release into master after production deploy." \
            --label "automated")

          echo "Created PR: $PR_URL"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge for PR
        env:
          GH_TOKEN: ${{ secrets.PR_AUTOMATION_TOKEN }}
        run: |
          PR_NUMBER=$(echo "${{ steps.create_pr.outputs.pr_url }}" | sed 's/.*\/pull\/\([0-9]*\)/\1/')
          echo "PR Number: $PR_NUMBER"

          # Enable auto-merge so the PR merges to master once checks pass.
          gh pr merge "$PR_NUMBER" --auto --merge
          echo "Auto-merge enabled for PR #$PR_NUMBER"
