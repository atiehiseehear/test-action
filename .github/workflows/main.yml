name: Sync Release to Master (Auto)

on:
  workflow_dispatch:
  push:
    branches: [release]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Create PR from release snapshot -> master
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          # Use a bot token (PAT or GitHub App token) if your rules are strict.
          token: ${{ secrets.SYNC_BOT_TOKEN }}
          base: master
          branch: automation/release-to-master
          title: "chore: sync release into master"
          body: |
            This PR is created from the current state of the release branch.
          labels: automated
          delete-branch: true

      - name: Enable auto-merge (merges when checks/approvals pass)
        if: ${{ steps.cpr.outputs.pull-request-number != '' }}
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.SYNC_BOT_TOKEN }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: merge