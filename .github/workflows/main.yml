name: Sync Release to Master

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge_release_to_master:
    name: Merge release -> master
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create PR from release to master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if PR already exists
          EXISTING_PR=$(gh pr list --base master --head release --json number --jq '.[0].number' || echo "")
          
          if [ -n "$EXISTING_PR" ]; then
            echo "PR already exists: #$EXISTING_PR"
            echo "pull-request-number=$EXISTING_PR" >> $GITHUB_OUTPUT
          else
            # Try to create PR, handle case where branches are in sync
            if PR_URL=$(gh pr create \
              --base master \
              --head release \
              --title "chore: sync release into master" \
              --body "Automated sync of release into master." \
              --label automated 2>&1); then
              PR_NUMBER=$(echo $PR_URL | grep -oP '\d+$')
              echo "pull-request-number=$PR_NUMBER" >> $GITHUB_OUTPUT
              echo "Created new PR: #$PR_NUMBER"
            else
              if echo "$PR_URL" | grep -q "No commits between"; then
                echo "Branches are already in sync - no PR needed"
                exit 0
              else
                echo "Error creating PR: $PR_URL"
                exit 1
              fi
            fi
          fi
        id: pr

      - name: Enable auto-merge
        if: ${{ steps.pr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ steps.pr.outputs.pull-request-number }} --auto --merge
