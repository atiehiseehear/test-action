name: Sync Release to Master

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge_release_to_master:
    name: Merge release -> master
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create sync branch and merge release
        id: merge
        run: |
          BRANCH_NAME="sync-release-to-master-$(date +%s)"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          git checkout -b $BRANCH_NAME
          git merge origin/release --no-edit
          git push origin $BRANCH_NAME

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --base master \
            --head ${{ steps.merge.outputs.branch_name }} \
            --title "chore: sync release into master" \
            --body "Automated sync of release into master." \
            --label automated)
          PR_NUMBER=$(echo $PR_URL | grep -oP '\d+$')
          echo "pull-request-number=$PR_NUMBER" >> $GITHUB_OUTPUT
        id: cpr

      - name: Enable auto-merge
        if: ${{ steps.cpr.outputs.pull-request-number != null && steps.cpr.outputs.pull-request-number != '' }}
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: merge
