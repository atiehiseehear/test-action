# Workflow: Release & Devtest Sync
# Triggered manually to sync devtest into release and create a dated release branch.
name: Release & Devtest Sync

on:
  workflow_dispatch: # Manual trigger only (no automatic triggers)

permissions:
  contents: write # Needed to push branches
  pull-requests: write # Needed to create and merge PRs

jobs:
  start_prod_phase:
    name: Sync & Create Release Branch
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repo with full history so we can compare branches
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Store today's date (YYYY-MM-DD) for naming the release branch later
      - name: Set Date Variable
        id: vars
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # Step 3: Compare release and devtest branches; skip PR creation if they are identical
      - name: Check for differences
        id: diff_check
        run: |
          if git diff --quiet origin/release origin/devtest; then
            echo "HAS_DIFF=false" >> $GITHUB_OUTPUT
            echo "No differences between release and devtest. Skipping PR creation."
          else
            echo "HAS_DIFF=true" >> $GITHUB_OUTPUT
          fi

      # Step 4: Open a PR to merge devtest into release (only if there are changes)
      - name: Create PR devtest -> release
        if: steps.diff_check.outputs.HAS_DIFF == 'true'
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --base release \
            --head devtest \
            --title "chore: sync devtest into release for prod" \
            --body "Automated PR to move devtest into release before production phase." \
            --label "automated")

          echo "PR_URL=$PR_URL" >> $GITHUB_OUTPUT

      # Step 5: Enable Auto-merge for the PR (only if it was created)
      - name: Enable Auto-merge on PR
        if: steps.create_pr.outputs.PR_URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(echo "${{ steps.create_pr.outputs.PR_URL }}" | awk -F'/' '{print $NF}')
          gh pr merge $PR_NUMBER --auto --squash --repo ${{ github.repository }}
          echo "Enabled auto-merge for PR #$PR_NUMBER"
          echo "PR_MERGED=true" >> $GITHUB_OUTPUT

      # Step 6: Fetch and switch to the updated release branch locally
      - name: Pull Latest Release
        run: |
          git fetch origin
          git checkout release
          git pull origin release

      # Step 7: Create a new dated branch (e.g. release-2026-03-06) from release for production fixes
      - name: Create release/YYYY-MM-DD Branch
        id: create_branch
        run: |
          NEW_BRANCH="release-${{ steps.vars.outputs.DATE }}"
          
          # Check if branch already exists locally or remotely
          if git show-ref --verify --quiet refs/heads/$NEW_BRANCH || git show-ref --verify --quiet refs/remotes/origin/$NEW_BRANCH; then
            echo "Branch $NEW_BRANCH already exists. Skipping branch creation."
            echo "BRANCH_ACTION=skipped" >> $GITHUB_OUTPUT
          else
            echo "Branch $NEW_BRANCH doesn't exist. Creating new branch."
            git checkout -b $NEW_BRANCH
            git push origin $NEW_BRANCH
            echo "BRANCH_ACTION=created" >> $GITHUB_OUTPUT
          fi

      # Step 8: Send a Slack notification summarizing what happened
      - name: Notify Slack
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": ":rocket: *Production Phase Started* (`streamcell-frontend`)\n\n`devtest` has been merged into `release`.\nRelease branch `release-${{ steps.vars.outputs.DATE }}` ${{ steps.create_branch.outputs.BRANCH_ACTION == 'created' && 'created' || 'already exists' }}.\n\nAll remaining changes for this release should target this branch."
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
