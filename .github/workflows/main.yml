name: Sync Release to Master

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch
      custom_version:
        description: 'Custom version (e.g., 1.2.3) - overrides version_type'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  merge_release_to_master:
    name: Merge release -> master
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create PR from release to master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if PR already exists
          EXISTING_PR=$(gh pr list --base master --head release --json number --jq '.[0].number' || echo "")
          
          if [ -n "$EXISTING_PR" ]; then
            echo "PR already exists: #$EXISTING_PR"
            echo "pull-request-number=$EXISTING_PR" >> $GITHUB_OUTPUT
          else
            # Try to create PR, handle case where branches are in sync
            if PR_URL=$(gh pr create \
              --base master \
              --head release \
              --title "chore: sync release into master" \
              --body "Automated sync of release into master." \
              --label automated 2>&1); then
              PR_NUMBER=$(echo $PR_URL | grep -oP '\d+$')
              echo "pull-request-number=$PR_NUMBER" >> $GITHUB_OUTPUT
              echo "Created new PR: #$PR_NUMBER"
            else
              if echo "$PR_URL" | grep -q "No commits between"; then
                echo "Branches are already in sync - no PR needed"
                exit 0
              else
                echo "Error creating PR: $PR_URL"
                exit 1
              fi
            fi
          fi
        id: pr

      - name: Enable auto-merge
        if: ${{ steps.pr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ steps.pr.outputs.pull-request-number }} --auto --merge

      - name: Calculate next version
        if: ${{ steps.pr.outputs.pull-request-number != '' || github.event.inputs.custom_version != '' }}
        id: version
        run: |
          # Get latest tag, default to v0.0.0 if none exists
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"
          
          # Use custom version if provided
          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            NEW_VERSION="v${{ github.event.inputs.custom_version }}"
          else
            # Remove 'v' prefix and split version
            VERSION=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            
            # Increment based on version type
            case "${{ github.event.inputs.version_type }}" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac
            
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Wait for PR to be merged
        if: ${{ steps.pr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ steps.pr.outputs.pull-request-number }}
          echo "Waiting for PR #$PR_NUMBER to be merged..."
          
          # Wait up to 5 minutes for PR to merge
          for i in {1..30}; do
            STATE=$(gh pr view $PR_NUMBER --json state --jq '.state')
            if [ "$STATE" = "MERGED" ]; then
              echo "PR merged successfully!"
              exit 0
            fi
            echo "PR state: $STATE - waiting... ($i/30)"
            sleep 10
          done
          
          echo "PR not merged within timeout, will create tag anyway"

      - name: Create GitHub Release
        if: ${{ steps.version.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --all
          git checkout master
          git pull origin master
          
          # Create and push tag
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}
          
          # Create GitHub release
          gh release create ${{ steps.version.outputs.version }} \
            --title "Release ${{ steps.version.outputs.version }}" \
            --notes "Automated release from sync of release branch to master" \
            --target master
