<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Interactive Landing Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        overflow: hidden;
        font-family: 'Arial', sans-serif;
        background: linear-gradient(135deg, #1e3a8a 0%, #059669 25%, #7c3aed 75%, #ec4899 100%);
        background-size: 400% 400%;
        animation: gradientShift 15s ease infinite;
        height: 100vh;
        position: relative;
      }

      @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      .content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: white;
        text-align: center;
        pointer-events: none;
      }

      h1 {
        font-size: 4rem;
        font-weight: bold;
        text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
        margin-bottom: 1rem;
        animation: fadeInDown 1s ease-out;
      }

      p {
        font-size: 1.5rem;
        text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.3);
        animation: fadeInUp 1s ease-out 0.3s backwards;
      }

      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .floating-object {
        position: absolute;
        opacity: 0.6;
        animation: float 6s ease-in-out infinite;
        z-index: 1;
      }

      .circle {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        border: 2px solid rgba(255, 255, 255, 0.4);
      }

      .square {
        width: 60px;
        height: 60px;
        background: rgba(255, 255, 255, 0.15);
        border: 2px solid rgba(255, 255, 255, 0.3);
        transform: rotate(45deg);
      }

      .triangle {
        width: 0;
        height: 0;
        border-left: 40px solid transparent;
        border-right: 40px solid transparent;
        border-bottom: 70px solid rgba(255, 255, 255, 0.2);
      }

      @keyframes float {
        0%, 100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-30px) rotate(180deg);
        }
      }

      .floating-object:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
      .floating-object:nth-child(2) { top: 20%; right: 15%; animation-delay: 1s; animation-duration: 8s; }
      .floating-object:nth-child(3) { bottom: 15%; left: 20%; animation-delay: 2s; animation-duration: 7s; }
      .floating-object:nth-child(4) { bottom: 25%; right: 10%; animation-delay: 1.5s; }
      .floating-object:nth-child(5) { top: 50%; left: 5%; animation-delay: 3s; animation-duration: 9s; }
      .floating-object:nth-child(6) { top: 60%; right: 8%; animation-delay: 2.5s; }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div class="floating-object circle"></div>
    <div class="floating-object square"></div>
    <div class="floating-object triangle"></div>
    <div class="floating-object circle"></div>
    <div class="floating-object square"></div>
    <div class="floating-object triangle"></div>

    <div class="content">
      <h1>Welcome</h1>
      <p>Move your mouse to create magic</p>
    </div>

    <script>
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const lines = [];
      let prevX = null;
      let prevY = null;

      class Line {
        constructor(x1, y1, x2, y2) {
          this.x1 = x1;
          this.y1 = y1;
          this.x2 = x2;
          this.y2 = y2;
          this.opacity = 1;
          this.fadeSpeed = 0.015;
          this.color = this.randomColor();
          this.width = Math.random() * 2 + 2;
        }

        randomColor() {
          const colors = [
            'rgba(14, 165, 233, ', // teal
            'rgba(168, 85, 247, ', // purple
            'rgba(236, 72, 153, ', // pink
            'rgba(255, 255, 255, ' // white
          ];
          return colors[Math.floor(Math.random() * colors.length)];
        }

        draw() {
          ctx.strokeStyle = this.color + this.opacity + ')';
          ctx.lineWidth = this.width;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(this.x1, this.y1);
          ctx.lineTo(this.x2, this.y2);
          ctx.stroke();
        }

        update() {
          this.opacity -= this.fadeSpeed;
          return this.opacity > 0;
        }
      }

      document.addEventListener('mousemove', (e) => {
        const x = e.clientX;
        const y = e.clientY;
        
        if (prevX !== null && prevY !== null) {
          // Create a line from previous position to current position
          lines.push(new Line(prevX, prevY, x, y));
        }
        
        prevX = x;
        prevY = y;
      });

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Update and draw lines
        for (let i = lines.length - 1; i >= 0; i--) {
          lines[i].draw();
          if (!lines[i].update()) {
            lines.splice(i, 1);
          }
        }
        
        requestAnimationFrame(animate);
      }

      animate();

      // Resize canvas when window resizes
      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });
    </script>
  </body>
</html>
